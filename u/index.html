<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picks · iBought</title>
<meta name="description" content="Things a friend bought and recommends. Shared with iBought.">
<meta name="robots" content="noindex">
<meta property="og:title" content="My picks on iBought">
<meta property="og:description" content="Things I bought myself and would recommend.">
<meta property="og:image" content="https://ibought.online/icon-512.png">
<meta property="og:site_name" content="iBought">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
  .picks-head { padding: 18px 0 6px; }
  .picks-head h1 { font-size: clamp(28px, 5vw, 40px); margin: 10px 0 6px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 16px 0 40px; }
  .pick { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; }
  .pick:hover { border-color: var(--coral); }
  .pick img, .pick .noimg { width: 100%; height: 170px; object-fit: contain; border-radius: 10px; background: #fff; }
  .pick .noimg { display: grid; place-items: center; color: var(--dim); font-size: 30px; background: var(--bg); }
  .pick b { font-size: 16px; line-height: 1.3; }
  .pick q { color: var(--dim); font-size: 14.5px; quotes: "“" "”"; }
  .pick span { margin-top: auto; color: var(--coral-deep); font-weight: 700; font-size: 15px; }
  .state { padding: 60px 0; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/"><img src="/apple-touch-icon.png" alt="">iBought</a>
    <nav><a href="/support/">Support</a><a href="/privacy/">Privacy</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="picks-head" id="head" hidden>
    <span class="tag">Bought and recommended</span>
    <h1 id="title"></h1>
    <p class="lead">Things they paid for themselves and would buy again.</p>
  </div>
  <div class="picks" id="picks"></div>
  <p class="state" id="state">Loading…</p>
</main>

<footer class="site">
  <div class="wrap">
    <p><a href="/">What is iBought?</a> · <a href="/support/">Support</a> · <a href="/privacy/">Privacy</a></p>
    <p>As an Amazon Associate I earn from qualifying purchases. iBought is not affiliated with, sponsored by, or endorsed by Amazon.</p>
  </div>
</footer>

<script>
(function () {
  // Public picks page: /u/#<handle>. Reads profiles/<handle> (public by the
  // security rules). Every value is written with textContent, never as HTML.
  var handle = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
  var state = document.getElementById('state');
  if (!/^[a-z0-9_]{3,20}$/.test(handle)) { state.textContent = 'This picks link is incomplete.'; return; }

  function val(f) {
    if (!f) return null;
    if ('stringValue' in f) return f.stringValue;
    if ('integerValue' in f) return Number(f.integerValue);
    return null;
  }

  fetch('https://firestore.googleapis.com/v1/projects/ibought-14838/databases/(default)/documents/profiles/' + handle + '?key=AIzaSyBrhS6xJ-B5u4W5fXgvn3fGMLjeRI4Huro')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (doc) {
      if (!doc || !doc.fields) { state.textContent = 'There is no picks page here.'; return; }
      var f = doc.fields;
      var name = (val(f.name) || '').trim();
      var key = val(f.k) || '';
      var picks = (f.picks && f.picks.arrayValue && f.picks.arrayValue.values) || [];
      document.getElementById('title').textContent = name ? name + '’s picks' : 'My picks';
      document.title = (name ? name + '’s picks' : 'Picks') + ' · iBought';
      document.getElementById('head').hidden = false;
      if (!picks.length) { state.textContent = 'No picks yet. Check back soon.'; return; }
      state.hidden = true;
      var box = document.getElementById('picks');
      picks.forEach(function (p) {
        var m = (p.mapValue && p.mapValue.fields) || {};
        var asin = (val(m.asin) || '').toUpperCase();
        if (!/^[A-Z0-9]{10}$/.test(asin)) return;
        var title = (val(m.title) || '').slice(0, 120);
        var image = val(m.image) || '';
        var note = (val(m.note) || '').slice(0, 280);
        var slug = title.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || '-';
        var okImage = /^[A-Za-z0-9+_-]{6,24}$/.test(image);
        var a = document.createElement('a');
        a.className = 'pick';
        a.href = '/r/#' + asin + '/' + slug + '/' + (okImage ? image : '-') + (/^[a-z0-9]{10}$/.test(key) ? '/' + key : '');
        var pic;
        if (okImage) {
          pic = document.createElement('img');
          pic.loading = 'lazy';
          pic.alt = '';
          pic.src = 'https://m.media-amazon.com/images/I/' + image + '._SL500_.jpg';
        } else {
          pic = document.createElement('div');
          pic.className = 'noimg';
          pic.textContent = '□';
        }
        var b = document.createElement('b');
        b.textContent = title || 'Something they liked';
        a.appendChild(pic);
        a.appendChild(b);
        if (note) { var q = document.createElement('q'); q.textContent = note; a.appendChild(q); }
        var go = document.createElement('span');
        go.textContent = 'See it';
        a.appendChild(go);
        box.appendChild(a);
      });
    })
    .catch(function () { state.textContent = 'Could not load this page. Check your connection and try again.'; });

  window.addEventListener('hashchange', function () { location.reload(); });
})();
</script>
</body>
</html>
